<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720">
<!-- eg-studio-v5 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F9F9"/>
      <stop offset="100%" stop-color="#E4EFF1"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163840"/>
      <stop offset="100%" stop-color="#0D2227"/>
    </linearGradient>
    <linearGradient id="metalFoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E4BA"/>
      <stop offset="50%" stop-color="#D4AE6A"/>
      <stop offset="100%" stop-color="#9B773E"/>
    </linearGradient>
    <filter id="bookShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0F1C22" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F1C22" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F1C22" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="640" height="720" fill="url(#bg)"/>
  <circle cx="520" cy="145" r="210" fill="#FFFFFF" opacity="0.72"/>
  <rect x="44" y="44" width="552" height="632" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.75"/>
  <!-- Folha Pólen decorativa ao fundo -->
  <g filter="url(#softShadow)" transform="rotate(-3 320 360)">
    <rect x="150" y="106" width="346" height="492" rx="8" fill="#FFFFFF" stroke="#D7EEEE" stroke-width="1"/>
  </g>
  <!-- Fitilho marcador em cetim -->
  <polygon points="282,598 302,598 302,654 292,642 282,654" fill="#0ABCBF" opacity="0.92"/>
  <!-- Capa Principal 3D com Design Explícito -->
  <g filter="url(#bookShadow)">
    <!-- Bloco de miolo lateral à direita -->
    <rect x="484" y="108" width="16" height="480" rx="3" fill="#FAF8F4" stroke="#DCE7E7" stroke-width="1"/>
    <line x1="491" y1="112" x2="491" y2="584" stroke="#E6E1D6" stroke-width="0.8"/>
    <line x1="495" y1="112" x2="495" y2="584" stroke="#E6E1D6" stroke-width="0.8"/>
    <!-- Capa dura frontal -->
    <rect x="150" y="96" width="340" height="504" rx="20" fill="url(#coverGrad)"/>
    <!-- Lombada com vinco editorial -->
    <rect x="150" y="96" width="32" height="504" rx="4" fill="#000000" opacity="0.16"/>
    <line x1="184" y1="98" x2="184" y2="598" stroke="#000000" stroke-width="1.4" opacity="0.22"/>
    <line x1="186" y1="98" x2="186" y2="598" stroke="#FFFFFF" stroke-width="0.7" opacity="0.18"/>
    <rect x="448" y="96" width="15" height="504" fill="#0D2227" opacity="0.88"/><rect x="448" y="96" width="2.5" height="504" fill="#0ABCBF" opacity="0.45"/>
    <!-- Moldura editorial em foil na capa -->
    <rect x="206" y="128" width="252" height="440" rx="8" fill="none" stroke="#0ABCBF" stroke-width="1" opacity="0.45"/>
    <!-- Selo superior -->
    <rect x="252" y="154" width="160" height="22" rx="11" fill="#0ABCBF" fill-opacity="0.18" stroke="#0ABCBF" stroke-width="0.8"/>
    <text x="332" y="168.5" text-anchor="middle" fill="#0ABCBF" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">STUDIO FULL</text>
    <!-- Título principal da capa -->
    <text x="332" y="232" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans',sans-serif" font-size="27" font-weight="800" letter-spacing="0.4">Organizador</text>
    <line x1="274" y1="252" x2="390" y2="252" stroke="#0ABCBF" stroke-width="1.5"/>
    <text x="332" y="276" text-anchor="middle" fill="#FFFFFF" opacity="0.88" font-family="sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.8">PROJETOS, METAS &amp; ROTINA</text>
    <!-- Ilustração temática explícita na capa -->
    
    <g stroke="#0ABCBF" fill="none" opacity="0.92">
      <circle cx="332" cy="368" r="52" stroke-width="1.3" stroke-dasharray="4 4"/>
      <path d="M332 322 L343 357 L378 368 L343 379 L332 414 L321 379 L286 368 L321 357 Z" fill="#0ABCBF" fill-opacity="0.22" stroke-width="1.6"/>
    </g>
    <!-- Assinatura na base da capa -->
    <text x="332" y="544" text-anchor="middle" fill="#0ABCBF" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" letter-spacing="3">EDITORGRÁFICA PRO</text>
    
  </g>
</svg>