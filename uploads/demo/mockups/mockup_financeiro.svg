<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720">
<!-- eg-studio-v5 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FAF8"/>
      <stop offset="100%" stop-color="#E5F3EE"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#115E52"/>
      <stop offset="100%" stop-color="#093B33"/>
    </linearGradient>
    <linearGradient id="metalFoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E4BA"/>
      <stop offset="50%" stop-color="#D4AE6A"/>
      <stop offset="100%" stop-color="#9B773E"/>
    </linearGradient>
    <filter id="bookShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0F1C22" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0F1C22" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F1C22" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="640" height="720" fill="url(#bg)"/>
  <circle cx="520" cy="145" r="210" fill="#FFFFFF" opacity="0.72"/>
  <rect x="44" y="44" width="552" height="632" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.75"/>
  <!-- Folha Pólen decorativa ao fundo -->
  <g filter="url(#softShadow)" transform="rotate(-3 320 360)">
    <rect x="150" y="106" width="346" height="492" rx="8" fill="#FFFFFF" stroke="#D7EEEE" stroke-width="1"/>
  </g>
  <!-- Fitilho marcador em cetim -->
  <polygon points="282,598 302,598 302,654 292,642 282,654" fill="#E5C17B" opacity="0.92"/>
  <!-- Capa Principal 3D com Design Explícito -->
  <g filter="url(#bookShadow)">
    <!-- Bloco de miolo lateral à direita -->
    <rect x="484" y="108" width="16" height="480" rx="3" fill="#FAF8F4" stroke="#DCE7E7" stroke-width="1"/>
    <line x1="491" y1="112" x2="491" y2="584" stroke="#E6E1D6" stroke-width="0.8"/>
    <line x1="495" y1="112" x2="495" y2="584" stroke="#E6E1D6" stroke-width="0.8"/>
    <!-- Capa dura frontal -->
    <rect x="150" y="96" width="340" height="504" rx="10" fill="url(#coverGrad)"/>
    <!-- Lombada com vinco editorial -->
    <rect x="150" y="96" width="32" height="504" rx="4" fill="#000000" opacity="0.16"/>
    <line x1="184" y1="98" x2="184" y2="598" stroke="#000000" stroke-width="1.4" opacity="0.22"/>
    <line x1="186" y1="98" x2="186" y2="598" stroke="#FFFFFF" stroke-width="0.7" opacity="0.18"/>
    <line x1="202" y1="96" x2="202" y2="600" stroke="#E5C17B" stroke-width="1" opacity="0.32"/>
    <!-- Moldura editorial em foil na capa -->
    <rect x="206" y="128" width="252" height="440" rx="8" fill="none" stroke="#E5C17B" stroke-width="1" opacity="0.45"/>
    <!-- Selo superior -->
    <rect x="252" y="154" width="160" height="22" rx="11" fill="#E5C17B" fill-opacity="0.18" stroke="#E5C17B" stroke-width="0.8"/>
    <text x="332" y="168.5" text-anchor="middle" fill="#E5C17B" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6">GESTÃO 2027</text>
    <!-- Título principal da capa -->
    <text x="332" y="232" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans',sans-serif" font-size="27" font-weight="800" letter-spacing="0.4">Financeira</text>
    <line x1="274" y1="252" x2="390" y2="252" stroke="#E5C17B" stroke-width="1.5"/>
    <text x="332" y="276" text-anchor="middle" fill="#FFFFFF" opacity="0.88" font-family="sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.8">FLUXO DE CAIXA &amp; BALANÇO</text>
    <!-- Ilustração temática explícita na capa -->
    
    <g stroke="#E5C17B" fill="none" stroke-width="1.6" opacity="0.92">
      <rect x="276" y="324" width="112" height="92" rx="8" fill="#E5C17B" fill-opacity="0.08"/>
      <line x1="292" y1="352" x2="372" y2="352" stroke-width="0.9" opacity="0.55"/>
      <rect x="296" y="376" width="14" height="28" rx="2" fill="#E5C17B" fill-opacity="0.35"/>
      <rect x="318" y="364" width="14" height="40" rx="2" fill="#E5C17B" fill-opacity="0.55"/>
      <rect x="340" y="346" width="14" height="58" rx="2" fill="#E5C17B" fill-opacity="0.80"/>
      <polyline points="298,366 324,352 350,336 372,340" stroke-width="1.8"/>
    </g>
    <!-- Assinatura na base da capa -->
    <text x="332" y="544" text-anchor="middle" fill="#E5C17B" font-family="'Plus Jakarta Sans',sans-serif" font-size="10" font-weight="700" letter-spacing="3">EDITORGRÁFICA PRO</text>
    <rect x="132" y="128" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="131.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="164" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="167.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="200" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="203.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="236" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="239.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="272" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="275.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="308" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="311.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="344" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="347.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="380" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="383.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="416" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="419.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="452" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="455.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="488" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="491.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="524" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="527.5" r="3.2" fill="#0F1C22" opacity="0.48"/><rect x="132" y="560" width="34" height="7" rx="3.5" fill="url(#metalFoil)" stroke="#6B532B" stroke-width="0.5"/><circle cx="166" cy="563.5" r="3.2" fill="#0F1C22" opacity="0.48"/>
  </g>
</svg>